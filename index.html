<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel zen garden. Rake the sand, place stones, and rake rings around them.">
<meta name="theme-color" content="#e6dbc2">
<style>[hidden]{display:none!important}</style>
<title>Zen Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: the whole window is a raked sand garden. Round buttons sit in three corners, the tool bar
   floats at the bottom centre, and settings open as a small panel. One deliberate look per time of day. */
:root {
  --sand: #e6dbc2;
  --ink: #f3ecde;
  --muted: #cfc3aa;
  --panel: rgba(24, 20, 16, 0.9);
  --line: rgba(235, 222, 196, 0.24);
  --accent: #d6aa5c;
  --pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
body.night {
  --panel: rgba(12, 16, 26, 0.92);
  --line: rgba(190, 205, 235, 0.24);
  --accent: #aac4e6;
  --muted: #b3bdd3;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sand);
  color: var(--ink);
  font-family: var(--pixel);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#garden {
  position: fixed;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: none;
}

/* ---- corner buttons ---- */
.ctl { position: fixed; z-index: 2; transition: opacity 0.7s ease; }
body.idle .ctl { opacity: 0; pointer-events: none; }
body.idle #tools { opacity: 0.0; pointer-events: none; }
.round {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--panel);
  border: 2px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  padding: 0;
}
.round svg { width: 28px; height: 28px; shape-rendering: crispEdges; }
#fsBtn { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); }
#settingsBtn { top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); }
#soundBtn { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); }
#fsBtn .fs-exit, #soundBtn .waves { display: none; }
#fsBtn[aria-pressed="true"] .fs-exit, #soundBtn[aria-pressed="true"] .waves { display: block; }
#fsBtn[aria-pressed="true"] .fs-enter, #soundBtn[aria-pressed="true"] .mute { display: none; }
#soundBtn[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---- tool bar ---- */
#tools {
  position: fixed;
  z-index: 2;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
  padding: 8px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 10px;
  transition: opacity 0.7s ease;
}
.tool {
  width: 84px;
  height: 52px;
  display: grid;
  grid-template-rows: 1fr auto;
  justify-items: center;
  align-items: center;
  gap: 2px;
  padding: 6px 0 5px;
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}
.tool svg { width: 30px; height: 20px; shape-rendering: crispEdges; }
.tool[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: rgba(255, 255, 255, 0.12); }
.tool.undo { width: 64px; }
.tool:disabled { opacity: 0.4; cursor: default; }

/* ---- toast & hint ---- */
#toast, #hint {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  transition: opacity 0.6s ease;
}
#toast {
  top: calc(22px + env(safe-area-inset-top, 0px));
  font-size: 15px;
  letter-spacing: 0.08em;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--panel);
  opacity: 0;
}
#toast.show { opacity: 1; transition: none; }
#hint {
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 0.06em;
  padding: 8px 14px;
  border-radius: 6px;
  background: var(--panel);
}
#hint.gone { opacity: 0; }

/* ---- settings ---- */
#panel {
  position: fixed;
  z-index: 3;
  top: calc(76px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  width: min(300px, calc(100vw - 28px));
  max-height: calc(100% - 100px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  box-sizing: border-box;
  padding: 16px 18px 18px;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 6px;
}
#panel[hidden] { display: none; }
#panel header { display: flex; align-items: center; justify-content: space-between; }
#panel h2 { margin: 0; font-size: 16px; font-weight: 400; letter-spacing: 0.1em; }
.textbtn {
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: none;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 10px;
  cursor: pointer;
}
.field { display: grid; gap: 8px; }
.field > label, .field > .label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.field output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.choices { display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); }
.choices.four { grid-template-columns: repeat(4, 1fr); }
.choices.two { grid-template-columns: repeat(2, 1fr); }
.choice {
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid transparent;
  border-radius: 4px;
  padding: 8px 2px;
  cursor: pointer;
}
.choice[aria-pressed="true"] { border-color: var(--accent); }
.swatch { height: 22px; border-radius: 3px; margin-bottom: 6px; border: 1px solid rgba(0, 0, 0, 0.25); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .wide { grid-column: 1 / -1; }
.keys { margin: 0; font-size: 11px; line-height: 1.8; letter-spacing: 0.05em; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .ctl, #tools, #toast, #hint { transition: none; }
}
</style>
</head>
<body>
<canvas id="garden" aria-label="A raked sand garden. Drag to rake the sand, or choose the stone tool to place stones."></canvas>

<button class="ctl round" id="fsBtn" aria-label="Full screen" aria-pressed="false" hidden>
  <svg viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
    <g class="fs-enter">
      <rect x="1" y="1" width="4" height="1"/><rect x="1" y="1" width="1" height="4"/>
      <rect x="9" y="1" width="4" height="1"/><rect x="12" y="1" width="1" height="4"/>
      <rect x="1" y="12" width="4" height="1"/><rect x="1" y="9" width="1" height="4"/>
      <rect x="9" y="12" width="4" height="1"/><rect x="12" y="9" width="1" height="4"/>
    </g>
    <g class="fs-exit">
      <rect x="1" y="4" width="4" height="1"/><rect x="4" y="1" width="1" height="4"/>
      <rect x="9" y="4" width="4" height="1"/><rect x="9" y="1" width="1" height="4"/>
      <rect x="1" y="9" width="4" height="1"/><rect x="4" y="9" width="1" height="4"/>
      <rect x="9" y="9" width="4" height="1"/><rect x="9" y="9" width="1" height="4"/>
    </g>
  </svg>
</button>

<button class="ctl round" id="settingsBtn" aria-label="Garden settings" aria-expanded="false" aria-controls="panel">
  <svg viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
    <rect x="2" y="3" width="10" height="1"/><rect x="8" y="2" width="2" height="3"/>
    <rect x="2" y="7" width="10" height="1"/><rect x="4" y="6" width="2" height="3"/>
    <rect x="2" y="11" width="10" height="1"/><rect x="9" y="10" width="2" height="3"/>
  </svg>
</button>

<button class="ctl round" id="soundBtn" aria-label="Sound on" aria-pressed="false">
  <svg viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
    <rect x="1" y="5" width="3" height="4"/><rect x="4" y="4" width="1" height="6"/><rect x="5" y="3" width="1" height="8"/><rect x="6" y="2" width="1" height="10"/>
    <g class="waves"><rect x="9" y="5" width="1" height="4"/><rect x="11" y="3" width="1" height="8"/><rect x="10" y="4" width="1" height="1"/><rect x="10" y="9" width="1" height="1"/></g>
    <g class="mute"><rect x="9" y="5" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="9" y="8" width="1" height="1"/></g>
  </svg>
</button>

<nav id="tools" aria-label="Tools">
  <button class="tool" data-tool="rake" aria-pressed="true" title="Rake (1)">
    <svg viewBox="0 0 15 10" aria-hidden="true" fill="currentColor">
      <rect x="2" y="0" width="1" height="3"/><rect x="5" y="0" width="1" height="3"/><rect x="8" y="0" width="1" height="3"/><rect x="11" y="0" width="1" height="3"/>
      <rect x="2" y="3" width="10" height="1"/><rect x="6" y="4" width="2" height="6"/>
    </svg>
    rake
  </button>
  <button class="tool" data-tool="stone" aria-pressed="false" title="Stone (2)">
    <svg viewBox="0 0 15 10" aria-hidden="true">
      <rect x="3" y="3" width="9" height="5" fill="#8f8b82"/><rect x="4" y="2" width="6" height="1" fill="#8f8b82"/><rect x="2" y="5" width="1" height="2" fill="#8f8b82"/>
      <rect x="4" y="3" width="4" height="2" fill="#c3beb2"/><rect x="3" y="8" width="9" height="1" fill="#5d5a54"/>
    </svg>
    stone
  </button>
  <button class="tool" data-tool="smooth" aria-pressed="false" title="Smooth (3)">
    <svg viewBox="0 0 15 10" aria-hidden="true" fill="currentColor">
      <rect x="2" y="6" width="11" height="2"/><rect x="4" y="4" width="7" height="2"/><rect x="6" y="2" width="3" height="2"/><rect x="7" y="0" width="1" height="2"/>
    </svg>
    smooth
  </button>
  <button class="tool" data-tool="rings" aria-pressed="false" title="Rings (4)">
    <svg viewBox="0 0 15 10" aria-hidden="true" fill="currentColor">
      <rect x="6" y="4" width="3" height="2"/>
      <rect x="4" y="2" width="7" height="1"/><rect x="4" y="7" width="7" height="1"/><rect x="3" y="3" width="1" height="4"/><rect x="11" y="3" width="1" height="4"/>
      <rect x="2" y="0" width="11" height="1"/><rect x="2" y="9" width="11" height="1"/><rect x="0" y="1" width="2" height="8"/><rect x="13" y="1" width="2" height="8"/>
    </svg>
    rings
  </button>
  <button class="tool undo" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
    <svg viewBox="0 0 15 10" aria-hidden="true" fill="currentColor">
      <rect x="1" y="3" width="1" height="1"/><rect x="2" y="2" width="1" height="3"/><rect x="3" y="1" width="1" height="5"/>
      <rect x="4" y="3" width="7" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="12" y="5" width="1" height="3"/><rect x="11" y="8" width="1" height="1"/><rect x="7" y="9" width="4" height="1"/>
    </svg>
    undo
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="hint">drag to rake the sand<br>pick a tool below to place stones</div>

<section id="panel" role="dialog" aria-label="Garden settings" hidden>
  <header>
    <h2>garden</h2>
    <button class="textbtn" id="closeBtn">close</button>
  </header>

  <div class="field">
    <span class="label" id="sandLabel">sand</span>
    <div class="choices four" id="sand" role="group" aria-labelledby="sandLabel"></div>
  </div>

  <div class="field">
    <span class="label" id="timeLabel">time of day</span>
    <div class="choices" id="time" role="group" aria-labelledby="timeLabel"></div>
  </div>

  <div class="field">
    <label for="tines">rake width <output id="tinesOut" for="tines">4 tines</output></label>
    <input type="range" id="tines" min="2" max="8" step="1" value="4">
  </div>

  <div class="field">
    <label for="depth">groove depth <output id="depthOut" for="depth">3</output></label>
    <input type="range" id="depth" min="1" max="5" step="1" value="3">
  </div>

  <div class="field">
    <span class="label" id="sizeLabel">new stones</span>
    <div class="choices four" id="size" role="group" aria-labelledby="sizeLabel"></div>
  </div>

  <div class="field">
    <span class="label" id="mossLabel">moss on new stones</span>
    <div class="choices two" id="moss" role="group" aria-labelledby="mossLabel"></div>
  </div>

  <div class="field">
    <label for="volume">volume <output id="volumeOut" for="volume">6</output></label>
    <input type="range" id="volume" min="1" max="10" step="1" value="6">
  </div>

  <div class="actions">
    <button class="textbtn" id="reRake">rake straight</button>
    <button class="textbtn" id="shuffle">shuffle stones</button>
    <button class="textbtn wide" id="clearStones">clear all stones</button>
  </div>

  <p class="keys">1 rake &nbsp; 2 stone &nbsp; 3 smooth &nbsp; 4 rings<br>ctrl+z undo &nbsp; m sound &nbsp; s settings<br>enter full screen<br>stone tool: scroll to resize<br>right-click a stone to remove it</p>
</section>

<script>
(() => {
  // ---------------- constants ----------------
  const SAND = {
    pale: [0xA8987A, 0xC2B396, 0xD6C9AC, 0xE6DBC2, 0xF2EAD6],
    warm: [0x9C8358, 0xB59C70, 0xC9B286, 0xDAC59C, 0xE8D8B4],
    grey: [0x86837C, 0x9C9992, 0xB1AEA7, 0xC5C2BB, 0xD8D5CF],
    moon: [0x5A6276, 0x6E7890, 0x838EA8, 0x99A4BE, 0xB3BDD3],
  };
  const SAND_NAMES = ["pale", "warm", "grey", "moon"];
  const TIMES = ["day", "dusk", "night"];
  const SIZES = [["small", [4, 6]], ["medium", [7, 10]], ["large", [11, 15]], ["mixed", [4, 14]]];
  const TONES = [0x8C877C, 0x9A9384, 0x7E7A72, 0x6F6B66, 0x857A6B, 0x767C86];
  const S = 4;            // groove spacing in game pixels
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const SAVE_KEY = "zen-garden-v1";

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dither = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
  function mix(c1, c2, a) {
    const ia = 255 - a;
    return ((((c1 >> 16) & 255) * ia + ((c2 >> 16) & 255) * a) / 255 << 16) |
      ((((c1 >> 8) & 255) * ia + ((c2 >> 8) & 255) * a) / 255 << 8) |
      (((c1 & 255) * ia + (c2 & 255) * a) / 255 | 0);
  }

  // ---------------- settings ----------------
  const DEFAULTS = { sand: "pale", time: "day", tines: 4, depth: 3, size: 3, moss: 1, sound: 0, volume: 6 };
  let prefs = { ...DEFAULTS };
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (saved && saved.prefs) prefs = { ...DEFAULTS, ...saved.prefs };
  } catch (e) { saved = null; }

  // ---------------- canvas ----------------
  const canvas = document.getElementById("garden");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, scale = 4;
  let h, grain, mask, sandRGB, px, img, out32, lightR, lightG, lightB;
  let rocks = [];
  let dirty = true, t = 0;

  function set(x, y, c) {
    x |= 0; y |= 0;
    if (x >= 0 && y >= 0 && x < W && y < H) px[y * W + x] = c;
  }
  function blend(x, y, c, a) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
    const i = y * W + x;
    px[i] = a >= 255 ? c : mix(px[i], c, a | 0);
  }
  function ring(cx, cy, r, c, a, squash = 1) {
    const steps = Math.max(16, (r * 7) | 0);
    let lx = NaN, ly = NaN;
    for (let i = 0; i < steps; i++) {
      const ang = (i * Math.PI * 2) / steps;
      const x = Math.floor(cx + Math.cos(ang) * r), y = Math.floor(cy + Math.sin(ang) * r * squash);
      if (x === lx && y === ly) continue;
      blend(x, y, c, a);
      lx = x; ly = y;
    }
  }

  // ---------------- stones ----------------
  function newRock(x, y, size) {
    const [a, b] = SIZES[prefs.size][1];
    const rx = size || rand(a, b);
    return {
      x, y, rx, ry: rx * rand(0.66, 0.84),
      tone: TONES[(Math.random() * TONES.length) | 0],
      moss: prefs.moss && Math.random() < 0.75,
      ph: rand(0, 6.28),
    };
  }
  // shape: an ellipse with a few gentle bumps, so every stone is different
  function rockR(r, x, y) {
    const dx = (x - r.x) / r.rx, dy = (y - r.y) / r.ry;
    const ang = Math.atan2(dy, dx);
    const bump = 1 + 0.12 * Math.sin(ang * 3 + r.ph) + 0.07 * Math.sin(ang * 5 + r.ph * 2);
    return Math.sqrt(dx * dx + dy * dy) / bump;
  }
  function rebuildMask() {
    mask.fill(0);
    rocks.forEach((r, n) => {
      for (let y = Math.floor(r.y - r.ry * 1.3); y <= Math.ceil(r.y + r.ry * 1.3); y++)
        for (let x = Math.floor(r.x - r.rx * 1.3); x <= Math.ceil(r.x + r.rx * 1.3); x++)
          if (x >= 0 && y >= 0 && x < W && y < H && rockR(r, x + 0.5, y + 0.5) < 1) mask[y * W + x] = n + 1;
    });
  }
  function rockAt(x, y) {
    for (let i = rocks.length - 1; i >= 0; i--) if (rockR(rocks[i], x, y) < 1.15) return rocks[i];
    return null;
  }
  /** Sand under a newly placed stone is pressed flat. */
  function pressUnder(r) {
    for (let y = Math.floor(r.y - r.ry * 1.3); y <= Math.ceil(r.y + r.ry * 1.3); y++)
      for (let x = Math.floor(r.x - r.rx * 1.3); x <= Math.ceil(r.x + r.rx * 1.3); x++) {
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const d = rockR(r, x + 0.5, y + 0.5);
        if (d < 1.05) h[y * W + x] = 0;
        else if (d < 1.2) h[y * W + x] = h[y * W + x] * 0.5 + 0.35; // a little pushed-up rim
      }
  }

  // ---------------- sand shaping ----------------
  const amp = () => 0.55 + prefs.depth * 0.22;
  function straightLines() {
    const a = amp();
    for (let y = 0; y < H; y++) {
      const v = -Math.cos((2 * Math.PI * (y + 0.5)) / S) * a;
      for (let x = 0; x < W; x++) h[y * W + x] = v;
    }
  }
  function rakeRings(cx, cy, r0, rings, squash) {
    const a = amp(), outer = r0 + rings * S;
    for (let y = Math.floor(cy - outer / squash - 1); y <= cy + outer / squash + 1; y++)
      for (let x = Math.floor(cx - outer - 1); x <= cx + outer + 1; x++) {
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = y * W + x;
        if (mask[i]) continue;
        const d = Math.hypot(x + 0.5 - cx, (y + 0.5 - cy) / squash);
        if (d < r0 - 0.5 || d > outer + 0.5) continue;
        const v = -Math.cos((2 * Math.PI * (d - r0)) / S) * a;
        h[i] = d > outer - 0.5 || d < r0 ? (h[i] + v) / 2 : v;
      }
    dirty = true;
  }
  function ringsAroundRock(r) {
    rakeRings(r.x, r.y, r.rx * 1.15 + 2.5, Math.max(3, prefs.tines), r.ry / r.rx);
  }
  // one stamp of the rake: tines across the stroke at point (x, y), normal (nx, ny)
  function rakeStamp(x, y, nx, ny) {
    const a = amp(), half = (prefs.tines * S) / 2;
    for (let o = -half; o <= half; o += 0.5) {
      const qx = Math.floor(x + nx * o), qy = Math.floor(y + ny * o);
      if (qx < 0 || qy < 0 || qx >= W || qy >= H) continue;
      const i = qy * W + qx;

  // ---------------- lighting & rendering ----------------
  function buildLight() {

          const k = (0.62 + 0.42 * sun) * vig;
          r = k * 1.08; g = k * 0.9; b = k * 0.74;
        } else if (prefs.time === "night") {

  function computeSand() {
    const pal = SAND[prefs.sand], n = pal.length - 1;

  function drawRocks() {
    const night = prefs.time === "night";

      const sx = r.x + r.rx * 0.35, sy = r.y + r.ry * 0.45;
      for (let y = Math.floor(sy - r.ry * 1.1); y <= sy + r.ry * 1.1; y++)

          const dx = (x + 0.5 - sx) / (r.rx * 1.05), dy = (y + 0.5 - sy) / r.ry;

      if (!r.moss) continue;
      const mc = night ? 0x3E5E2E : 0x6E8B3D, ml = night ? 0x55703A : 0x8AA64C;
      for (let y = Math.floor(r.y - r.ry - 3); y <= r.y + r.ry + 4; y++)

          const lx = x - Math.floor(r.x), ly = y - Math.floor(r.y);

    }
    // stones, back to front
    const order = rocks.slice().sort((a, b) => a.y - b.y);
    for (const r of order) {
      const c0 = r.tone;
      const shades = [mix(c0, 0, 115), mix(c0, 0, 64), c0, mix(c0, 0xFFFFFF, 60)];
      for (let y = Math.floor(r.y - r.ry * 1.3); y <= r.y + r.ry * 1.3; y++)
        for (let x = Math.floor(r.x - r.rx * 1.3); x <= r.x + r.rx * 1.3; x++) {
          if (x < 0 || y < 0 || x >= W || y >= H) continue;
          const d = rockR(r, x + 0.5, y + 0.5);
          if (d >= 1) continue;
          const dx = (x + 0.5 - r.x) / r.rx, dy = (y + 0.5 - r.y) / r.ry;
          const lit = -(dx * 0.6 + dy * 0.8) * 0.9 + (1 - d) * 0.4;

  function drawCursor() {
    if (!cursor.on || !panelClosed()) return;
    const dark = prefs.time === "night" ? 0xDDE6F5 : 0x3A2E22;
    const x = cursor.x, y = cursor.y;
    if (tool === "rake") {
      const nx = -cursor.dy, ny = cursor.dx, half = (prefs.tines * S) / 2;
      for (let o = -half + S / 2; o <= half - S / 2 + 0.01; o += S) {

  function render() {

        f[1] += Math.sin(f[2] * 1.3) * dt * 2.5;

      r.moss = moss;
      rocks.push(r);

    rebuildMask();

  }

  function shuffleStones() {
    pushUndo();

    straightLines();
    const n = 3 + ((Math.random() * 3) | 0);
    for (let k = 0; k < n; k++) {
      for (let tries = 0; tries < 30; tries++) {
        const r = newRock(rand(W * 0.12, W * 0.88), rand(H * 0.15, H * 0.8));

    rocks.forEach((r) => { pressUnder(r); ringsAroundRock(r); });

    dirty = true;
    sfx.stone();
    scheduleSave();
  }

  function encodeH() {
    const b = new Int8Array(W * H);

  function layout(first) {

    const gw = Math.ceil(w / s), gh = Math.ceil(hh / s);

    scale = s;
    canvas.width = gw; canvas.height = gh;
    canvas.style.width = gw * s + "px"; canvas.style.height = gh * s + "px";

  function undo() {

    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      wd[i] = w;
      last = (last + 0.02 * w) / 1.02;
      bd[i] = last * 3.5;

  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];

    lift: () => noise(2200, 1, 0.12, 0.05),

    body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (panel.hidden && !dragging) body.classList.add("idle"); }, 5000);
  }
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1300);
  }
  let hintShown = !saved;
  if (!hintShown) hint.classList.add("gone");
  function dismissHint() {
    if (!hintShown) return;
    hintShown = false;
    hint.classList.add("gone");
  }
  setTimeout(dismissHint, 12000);

  function nextGhost() {
    const [a, b] = SIZES[prefs.size][1];
    return rand(a, b);
  }
  function setTool(name) {
    tool = name;
    toolBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === name)));
    if (name === "stone") ghostSize = nextGhost();
    wake();
  }
  toolBtns.forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));
  undoBtn.addEventListener("click", () => { undo(); wake(); });

  function openPanel(open) {
    panel.hidden = !open;
    settingsBtn.setAttribute("aria-expanded", String(open));
    if (open) panel.querySelector(".choice").focus({ preventScroll: true });
    wake();
  }
  settingsBtn.addEventListener("click", () => openPanel(panel.hidden));
  document.getElementById("closeBtn").addEventListener("click", () => { openPanel(false); settingsBtn.focus(); });

  // settings controls
  function choiceGroup(id, items, current, onPick, swatch) {
    const box = document.getElementById(id);
    items.forEach((item, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      if (swatch) {
        const sw = document.createElement("div");
        sw.className = "swatch";
        const pal = SAND[item];
        const hx = (c) => "#" + c.toString(16).padStart(6, "0");
        sw.style.background = `repeating-linear-gradient(180deg, ${hx(pal[3])} 0 3px, ${hx(pal[1])} 3px 5px)`;
        b.append(sw);
      }
      b.append(document.createTextNode(Array.isArray(item) ? item[0] : item));
      b.addEventListener("click", () => { onPick(i, item); refreshControls(); });
      box.append(b);
    });
  }
  choiceGroup("sand", SAND_NAMES, null, (i, n) => { prefs.sand = n; dirty = true; savePrefsOnly(); }, true);
  choiceGroup("time", TIMES, null, (i, n) => {
    prefs.time = n;
    // moonlit sand suits the night; switch back to pale when the sun comes up
    if (n === "night" && prefs.sand === "pale") prefs.sand = "moon";
    if (n !== "night" && prefs.sand === "moon") prefs.sand = "pale";
    dirty = true; buildLight(); applyTheme(); savePrefsOnly();
  });
  choiceGroup("size", SIZES, null, (i) => { prefs.size = i; ghostSize = nextGhost(); savePrefsOnly(); });
  choiceGroup("moss", ["off", "on"], null, (i) => { prefs.moss = i; savePrefsOnly(); });
  const tines = document.getElementById("tines"), tinesOut = document.getElementById("tinesOut");
  const depth = document.getElementById("depth"), depthOut = document.getElementById("depthOut");
  const volume = document.getElementById("volume"), volumeOut = document.getElementById("volumeOut");
  tines.addEventListener("input", () => { prefs.tines = +tines.value; tinesOut.textContent = tines.value + " tines"; savePrefsOnly(); });
  depth.addEventListener("input", () => { prefs.depth = +depth.value; depthOut.textContent = depth.value; savePrefsOnly(); });
  volume.addEventListener("input", () => {
    prefs.volume = +volume.value; volumeOut.textContent = volume.value; applyVolume();
    if (!prefs.sound) setSound(1);
    sfx.chime();
    savePrefsOnly();
  });
  document.getElementById("reRake").addEventListener("click", () => {
    pushUndo(); straightLines(); rocks.forEach((r) => { pressUnder(r); ringsAroundRock(r); }); dirty = true;
    noise(2600, 0.6, 1.2, 0.14); scheduleSave(); say("raked straight");
  });
  document.getElementById("shuffle").addEventListener("click", () => { shuffleStones(); say("new stones"); });
  document.getElementById("clearStones").addEventListener("click", () => {
    if (!rocks.length) return;
    pushUndo(); rocks = []; rebuildMask(); dirty = true; scheduleSave(); say("stones cleared, ctrl+z to undo");
  });

  function refreshControls() {
    const mark = (id, fn) => [...document.getElementById(id).children].forEach((b, i) => b.setAttribute("aria-pressed", String(fn(i))));
    mark("sand", (i) => SAND_NAMES[i] === prefs.sand);
    mark("time", (i) => TIMES[i] === prefs.time);
    mark("size", (i) => i === prefs.size);
    mark("moss", (i) => i === (prefs.moss ? 1 : 0));
    tines.value = prefs.tines; tinesOut.textContent = prefs.tines + " tines";
    depth.value = prefs.depth; depthOut.textContent = prefs.depth;
    volume.value = prefs.volume; volumeOut.textContent = prefs.volume;
  }
  function applyTheme() { body.classList.toggle("night", prefs.time === "night"); }

  soundBtn.addEventListener("click", () => { setSound(!prefs.sound); say(prefs.sound ? "sound on" : "sound off"); wake(); });
  soundBtn.setAttribute("aria-pressed", String(!!prefs.sound));
  soundBtn.setAttribute("aria-label", prefs.sound ? "Sound off" : "Sound on");

  // full screen
  const root = document.documentElement;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(root.requestFullscreen || root.webkitRequestFullscreen);
  fsBtn.hidden = !canFullscreen;
  function syncFullscreen() {
    const on = !!fsElement();
    fsBtn.setAttribute("aria-pressed", String(on));
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
  }
  function toggleFullscreen() {
    wake();
    try {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: "hide" });
        if (r && r.catch) r.catch(() => say("full screen isn't available here"));
      }
    } catch (e) { say("full screen isn't available here"); }
  }
  fsBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncFullscreen);
  document.addEventListener("webkitfullscreenchange", syncFullscreen);

  // ---------------- pointer input ----------------
  let dragging = false, dragRock = null, dragOff = [0, 0], last = null, moved = 0, lastMoveT = 0;
  const toGame = (e) => [e.clientX / scale, e.clientY / scale];

  canvas.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const [x, y] = toGame(e);
    const r = rockAt(x, y);
    if (r) {
      pushUndo();
      rocks.splice(rocks.indexOf(r), 1);
      rebuildMask();
      dirty = true;
      sfx.lift();
      scheduleSave();
      say("stone removed");
    }
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (prefs.sound && !soundOn()) setSound(1);
    dismissHint();
    wake();
    if (!panel.hidden) openPanel(false);
    const [x, y] = toGame(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    dragging = true; last = [x, y]; moved = 0;
    cursor.on = true; cursor.x = x; cursor.y = y;
    if (tool === "rake") {
      pushUndo();
    } else if (tool === "smooth") {
      pushUndo();
      smoothStamp(x, y);
      dirty = true;
    } else if (tool === "stone") {
      const r = rockAt(x, y);
      if (r) {
        pushUndo();
        dragRock = r;
        dragOff = [r.x - x, r.y - y];
        sfx.lift();
      } else if (rocks.length < 40) {
        pushUndo();
        const nr = newRock(x, y, ghostSize);
        rocks.push(nr);
        rebuildMask();
        pressUnder(nr);
        dirty = true;
        ghostSize = nextGhost();
        sfx.stone();
      } else {
        say("that's plenty of stones");
      }
    } else if (tool === "rings") {
      pushUndo();
      const r = rockAt(x, y);
      if (r) ringsAroundRock(r);
      else rakeRings(x, y, 2, Math.max(3, prefs.tines), 1);
      sfx.rings();
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const [x, y] = toGame(e);
    const now = performance.now();
    if (cursor.on) {
      const dx = x - cursor.x, dy = y - cursor.y, d = Math.hypot(dx, dy);
      if (d > 0.3) {
        // the rake turns gradually to follow your hand
        let ux = cursor.dx * 0.6 + (dx / d) * 0.4, uy = cursor.dy * 0.6 + (dy / d) * 0.4;
        const m = Math.hypot(ux, uy) || 1;
        cursor.dx = ux / m; cursor.dy = uy / m;
      }
    }
    cursor.on = true; cursor.x = x; cursor.y = y;
    hoverRock = tool === "stone" || tool === "rings" ? rockAt(x, y) : null;
    if (!dragging) { if (e.pointerType === "mouse") wake(); return; }
    const [lx, ly] = last;
    const seg = Math.hypot(x - lx, y - ly);
    if (tool === "rake") {
      if (seg > 0) {
        const n = Math.max(1, Math.ceil(seg * 2)), nx = -cursor.dy, ny = cursor.dx;
        for (let i = 1; i <= n; i++) rakeStamp(lx + ((x - lx) * i) / n, ly + ((y - ly) * i) / n, nx, ny);
        dirty = true;
        const speed = seg / Math.max(0.008, (now - lastMoveT) / 1000);
        scrape(clamp(speed / 120, 0.05, 0.45), 2200 + Math.min(1600, speed * 6));
      }
    } else if (tool === "smooth") {
      const n = Math.max(1, Math.ceil(seg));
      for (let i = 1; i <= n; i++) smoothStamp(lx + ((x - lx) * i) / n, ly + ((y - ly) * i) / n);
      dirty = true;
      if (seg > 0) scrape(clamp(seg / 6, 0.03, 0.2), 1100);
    } else if (tool === "stone" && dragRock) {
      dragRock.x = clamp(x + dragOff[0], 0, W);
      dragRock.y = clamp(y + dragOff[1], 0, H);
      rebuildMask();
    }
    moved += seg;
    last = [x, y];
    lastMoveT = now;
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    scrape(0);
    if (dragRock) {
      pressUnder(dragRock);
      rebuildMask();
      dirty = true;
      if (moved > 1) sfx.stone();
      dragRock = null;
    }
    // a click with the rake that never moved shouldn't fill the undo list
    if (tool === "rake" && moved < 0.5 && undoStack.length) { undoStack.pop(); refreshUndo(); }
    scheduleSave();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", () => { if (!dragging) cursor.on = false; });

  canvas.addEventListener("wheel", (e) => {
    if (tool !== "stone") return;
    e.preventDefault();
    const [a, b] = [3.5, 16];
    ghostSize = clamp(ghostSize * (e.deltaY < 0 ? 1.1 : 0.9), a, b);
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (prefs.sound && !soundOn() && e.key !== "m" && e.key !== "M") setSound(1);
    if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); return; }
    if (e.target instanceof HTMLInputElement) {
      if (e.key === "Escape") { openPanel(false); settingsBtn.focus(); }
      return;
    }
    const k = e.key.toLowerCase();
    if (k >= "1" && k <= "4") setTool(["rake", "stone", "smooth", "rings"][+k - 1]);
    else if (k === "m") { setSound(!prefs.sound); say(prefs.sound ? "sound on" : "sound off"); wake(); }
    else if (k === "s") openPanel(panel.hidden);
    else if (e.key === "Escape" && !panel.hidden) { openPanel(false); settingsBtn.focus(); }
    else if (e.key === "Enter" && e.target === document.body && canFullscreen) toggleFullscreen();
    else wake();
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => layout(false), 150); });
  window.addEventListener("pagehide", saveNow);

  // ---------------- go ----------------
  layout(true);
  applyTheme();
  refreshControls();
  refreshUndo();
  wake();
  render();
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
